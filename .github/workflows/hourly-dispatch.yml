# Почасовая рассылка «Слово дня» (Vercel Hobby не поддерживает hourly cron).
# Secrets: SETUP_SECRET (обязательно) или CRON_SECRET; опционально DISPATCH_URL.
name: Hourly word dispatch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/daily
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          DISPATCH_URL: ${{ secrets.DISPATCH_URL }}
        run: |
          SECRET="${CRON_SECRET:-$SETUP_SECRET}"
          BASE="${DISPATCH_URL:-https://dudubot-ten.vercel.app}"
          URL="${BASE%/}/api/cron/daily"
          if [ -z "$SECRET" ]; then
            echo "::error::Add SETUP_SECRET or CRON_SECRET to GitHub repository secrets"
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${SECRET}" \
            "$URL" \
          || curl -fsS --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${SECRET}" \
            "${BASE%/}/api/migrate?secret=${SECRET}&run_dispatch=1"
